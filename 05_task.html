
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Age Eligibility Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 40px 15px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 12px #00000015;
        }

        h1 {
            color: #1e3a8a;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 5px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e40af;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>JavaScript Programs</h1>
        <p>Practice user input, alerts, and conditional statements.</p>

        <button onclick="showAlert()">Show Alert</button>
        <button onclick="checkAgeIfElse()">Check Age (If-Else)</button>
        <button onclick="checkAgeTernary()">Check Age (Ternary)</button>
        <button onclick="showDocumentWrite()">Document Write Demo</button>

        <p id="result">Your result will appear here.</p>
    </div>

    <script src="05_script.js"></script>
</body>
</html>
